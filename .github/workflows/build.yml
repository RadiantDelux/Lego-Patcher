name: Build LEGOPATCHER (MAUI)

# Builds the app for every platform and uploads the artifacts.
#   - Android (.apk)   on ubuntu  (unsigned debug-keystore APK, installable)
#   - Windows          on windows
#   - iOS (.ipa)       on macOS   (UNSIGNED - needs your Apple cert to install)
#   - macOS (.app)     on macOS
#
# IMPORTANT: this file must live at  .github/workflows/build.yml  in the ROOT
# of the GitHub repository. If the repo root IS the ToyPadMaui folder, set
# PROJECT to 'ToyPadMaui.csproj'. If the repo contains ToyPadMaui/ as a
# subfolder, keep 'ToyPadMaui/ToyPadMaui.csproj'.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT: ToyPadMaui.csproj

jobs:
  # ---------------------------------------------------------------- Android
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platforms/build-tools
        run: |
          sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android
      - name: Build APK (Release)
        run: >
          dotnet publish ${{ env.PROJECT }}
          -c Release -f net10.0-android
          -p:TargetFrameworks=net10.0-android
          -p:AndroidPackageFormat=apk
          -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: legopatcher-android
          path: |
            **/*-Signed.apk
            **/publish/*.apk
            **/bin/Release/net10.0-android/**/*.apk
          if-no-files-found: warn

  # ---------------------------------------------------------------- Windows
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows
      - name: Build (Release)
        run: >
          dotnet build ${{ env.PROJECT }}
          -c Release -f net10.0-windows10.0.19041.0
          -p:TargetFrameworks=net10.0-windows10.0.19041.0
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: legopatcher-windows
          path: 'bin/Release/net10.0-windows10.0.19041.0/**'
          if-no-files-found: warn

  # ------------------------------------------------------------------- iOS
  # macOS build dropped (only iOS wanted). The .NET iOS workload may require a
  # newer Xcode than the runner ships; we pick the newest Xcode available and
  # let the job soft-fail if there's still a mismatch.
  ios:
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: List installed Xcodes
        run: ls -1 /Applications | grep -i xcode || true
      - name: Select newest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - name: Show Xcode version
        run: xcodebuild -version
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios
      - name: Build iOS (Release, unsigned)
        run: >
          dotnet publish ${{ env.PROJECT }}
          -c Release -f net10.0-ios
          -p:TargetFrameworks=net10.0-ios
          -p:RuntimeIdentifier=ios-arm64
          -p:EnableCodeSigning=false
          -p:CodesignKey=
          -p:CodesignProvision=
          -p:BuildIpa=true
      - name: Upload iOS .ipa (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: legopatcher-ios-unsigned
          path: '**/*.ipa'
          if-no-files-found: warn
